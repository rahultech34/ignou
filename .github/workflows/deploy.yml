name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy IGNOU Portal to VPS
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Starting safe, resource-throttled deployment on VPS..."
            cd /var/www/ignou

            # Ensure log directory exists
            mkdir -p /var/log/pm2

            echo "📥 Pulling latest changes from GitHub..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Installing npm dependencies..."
            npm install --prefer-offline --no-audit

            echo "🔨 Building Next.js bundle with CPU & memory throttling (protects other live sites)..."
            NODE_OPTIONS="--max-old-space-size=1024" nice -n 19 npm run build

            echo "🔄 Restarting ignou-portal with PM2..."
            pm2 restart ignou-portal --update-env || pm2 start ecosystem.config.js
            pm2 save

            echo "✅ Deployment completed successfully with zero impact on other websites!"
