# Nginx Configuration Template for IGNOU Next.js Portal
# File path on VPS: /etc/nginx/sites-available/ignou.conf

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com; # Replace with your actual domain

    # Increase upload size limit for media uploads in admin panel
    client_max_body_size 25M;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        # Match this port with the PORT specified in ecosystem.config.js
        proxy_pass http://127.0.0.1:3005;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for longer requests (e.g. Next.js server actions)
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
    }
}

