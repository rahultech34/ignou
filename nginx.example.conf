# Nginx Configuration Template for IGNOU Next.js Portal
# Destination file path on VPS: /etc/nginx/sites-available/ignou.conf
# Enable symlink: ln -s /etc/nginx/sites-available/ignou.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name ignou.edukyu.com; # Replace with your actual domain

    # Increase upload size limit for media uploads in admin panel
    client_max_body_size 25M;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. Direct Next.js Static Asset Caching (Offloads CPU from Node.js)
    location /_next/static/ {
        alias /var/www/ignou/.next/static/;
        expires 365d;
        access_log off;
    }

    # 2. Public Uploads Caching
    location /uploads/ {
        alias /var/www/ignou/public/uploads/;
        expires 30d;
        access_log off;
    }

    # 3. Reverse Proxy to Port 3025 (Strictly mapped to ignou-portal)
    location / {
        proxy_pass http://127.0.0.1:3025;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for longer requests (e.g. Next.js server actions, CRM forwarding)
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
    }
}
